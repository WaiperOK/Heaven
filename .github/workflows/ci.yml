name: CI

on:
  push:
  pull_request:

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - arena_core
          - bevy_viewer
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all

